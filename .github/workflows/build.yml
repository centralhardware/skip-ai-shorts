name: Build Safari extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: ./convert.sh --macos-only

      - name: Build app (ad-hoc signed)
        run: |
          cd build/SkipAIShorts
          xcodebuild -list
          SCHEME=$(xcodebuild -list -json | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')
          echo "Scheme: $SCHEME"
          xcodebuild -scheme "$SCHEME" -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/dd" \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM="" MACOSX_DEPLOYMENT_TARGET=13.0 \
            build

      - name: Package
        run: |
          cd dd/Build/Products/Release
          ditto -c -k --keepParent SkipAIShorts.app "$GITHUB_WORKSPACE/Skip-AI-Shorts-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Skip-AI-Shorts-macOS
          path: Skip-AI-Shorts-macOS.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Skip-AI-Shorts-macOS.zip --generate-notes
